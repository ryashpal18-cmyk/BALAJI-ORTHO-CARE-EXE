name: Build Windows EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - name: Install dependencies
        run: npm install
      - name: Bump patch version
        id: bump
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # ✅ FIX: agar (concurrency lagne ke baad bhi, kisi rare case mein)
          # push reject ho jaaye, to khud hi latest khींच ke dobara try karo
          # — 3 baar tak — bina fail hue.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            npm version patch --no-git-tag-version
            VERSION=$(node -p "require('./package.json').version")
            git add package.json package-lock.json
            git commit -m "chore: bump version to v$VERSION [skip ci]"
            git tag -d "v$VERSION" 2>/dev/null || true
            git push origin ":refs/tags/v$VERSION" 2>/dev/null || true
            git tag -f "v$VERSION"
            if git push origin main && git push origin "v$VERSION" --force; then
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              break
            fi
            echo "Push reject hua (attempt $attempt) — latest khींच ke retry kar rahe hain..."
            sleep 5
          done
      - name: Build React App
        run: npm run build
      - name: Build & Publish Setup EXE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish always
      - name: Upload Setup EXE (build artifact, optional)
        uses: actions/upload-artifact@v4
        with:
          name: BalajiOrthoConnect-Setup-v${{ steps.bump.outputs.version }}
          path: release/*.exe
          retention-days: 30
