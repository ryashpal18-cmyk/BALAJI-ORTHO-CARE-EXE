name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build React App
        run: npm run build

      - name: Build EXE
        run: npx electron-builder --win portable --publish=never

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: BalajiOrthoConnect-EXE
          path: release/*.exe
          retention-days: 30
