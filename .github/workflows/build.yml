name: Build Windows EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  PUPPETEER_SKIP_DOWNLOAD: "true"
permissions:
  contents: write
concurrency:
  group: windows-main
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run typecheck
      - name: Check offline admin login
        run: |
          node tests/offline-login.cjs
          node tests/local-session.cjs
          node tests/cloud-sync.cjs
          node tests/auth-01.cjs
      - name: Check offline data integrity
        run: |
          node tests/report-02-20.cjs
          node tests/offline-first.cjs
          node tests/deep-audit.cjs
          node tests/audit-26.cjs
          node tests/sms-offline.cjs
          node tests/core-offline.cjs
          node tests/billing-catalog.cjs
          node tests/clinic-updates.cjs
          node tests/module-regressions.cjs
          node tests/due-collection-date.cjs
          node tests/message-and-estimate.cjs
          node tests/outreach.cjs
          node tests/receipt-origin.cjs
          node tests/attachment-backup.cjs
          node tests/full-backup-roundtrip.cjs
          node tests/pc-family-whatsapp.cjs
          node tests/festival-messaging.cjs
          node tests/diagnostics.cjs
          node tests/patient-statement.cjs
          node tests/monthly-report.cjs
          node tests/patient-directory.cjs
      - name: Check native diagnostic UI and error capture
        run: npx --no-install electron tests/diagnostics-electron.cjs
      - name: Check native patient statement PDF and UI
        run: npx --no-install electron tests/patient-statement-electron.cjs
      - name: Check native monthly report PDF and UI
        run: npx --no-install electron tests/monthly-report-electron.cjs
      - name: Check native patient directory search UI
        run: npx --no-install electron tests/patient-directory-electron.cjs
      - name: Check native festival greetings UI
        run: npx --no-install electron tests/festival-greetings-electron.cjs
      - name: Check native due collection dates and Cash Tally
        run: npx --no-install electron tests/due-collection-electron.cjs
      - name: Check native village and WhatsApp messaging UI
        run: npx --no-install electron tests/messaging-ui-electron.cjs
      - name: Check native QR invoice PDF
        run: npx --no-install electron tests/invoice-pdf-smoke.cjs
      - name: Bump patch version
        id: bump
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          git add package.json package-lock.json
          git commit -m "chore: bump version to v$VERSION [skip ci]"
          git tag "v$VERSION"
          git push --atomic origin HEAD:main "v$VERSION"
      - name: Build React App
        run: npm run build
      - name: Build & Publish Setup EXE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish always
      - name: Upload Setup EXE (build artifact, optional)
        uses: actions/upload-artifact@v4
        with:
          name: BalajiOrthoConnect-Setup-v${{ steps.bump.outputs.version }}
          path: release/*.exe
          retention-days: 30
