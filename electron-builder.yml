appId: com.balaji.ortho.connect
productName: Balaji Ortho Care Connect
copyright: "Balaji Ortho Care Center"

directories:
  output: release

asar: false

files:
  - "**/*"
  - "!src/**"
  - "!supabase/**"
  - "!.github/**"
  - "!*.md"
  - "!*.log"
  - "!eslint.config.js"
  - "!tailwind.config.ts"
  - "!postcss.config.cjs"
  - "!tsconfig.json"
  - "!vite.config.ts"
  - "!components.json"

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "BalajiOrthoConnect-Setup.exe"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
