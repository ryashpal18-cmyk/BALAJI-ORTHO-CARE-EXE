appId: com.balaji.ortho.connect
productName: Balaji Ortho Care Connect
copyright: "Balaji Ortho Care Center"

directories:
  output: release

asar: false

files:
  - dist/**
  - main.js
  - preload.js
  - package.json

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Balaji Ortho Care Connect"
  artifactName: "BalajiOrthoConnect-Setup-${version}.exe"
