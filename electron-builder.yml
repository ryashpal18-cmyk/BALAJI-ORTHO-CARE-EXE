appId: com.balaji.ortho.connect
productName: Balaji Ortho Care Connect
copyright: "Balaji Ortho Care Center"

directories:
  output: release

asar: false

files:
  - dist/**
  - electron-main.cjs
  - package.json

win:
  target:
    - target: nsis
      arch: [x64]
  icon: src/assets/logo.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Balaji Ortho Care Connect"
  installerIcon: src/assets/logo.png
  artifactName: "BalajiOrthoConnect-Setup-${version}.exe"
