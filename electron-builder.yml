appId: com.balaji.ortho.connect
productName: Balaji Ortho Care Connect
copyright: "Balaji Ortho Care Center"

directories:
  output: release

asar: false

publish:
  - provider: github
    owner: ryashpal18-cmyk
    repo: BALAJI-ORTHO-CARE-EXE
    releaseType: release

files:
  - dist/**
  - main.js
  - pc-messaging.cjs
  - clinic-finance.cjs
  - patient-merge.cjs
  - backup-verify.cjs
  - backup-shape.cjs
  - pdf-renderer.cjs
  - whatsapp-service.cjs
  - whatsapp-browser.cjs
  - messaging-log.cjs
  - family-profile.cjs
  - invoice-document.cjs
  - invoice-template.cjs
  - village-names.cjs
  - src/assets/invoice-brand.jpg
  - src/assets/payment-qr.png
  - patient-statement.cjs
  - monthly-report.cjs
  - festival-messaging.cjs
  - outreach-service.cjs
  - attachment-cache.cjs
  - preload.js
  - diagnostics.cjs
  - diagnostic-utils.cjs
  - logger.cjs
  - sqlite-store.cjs
  - sms-outbox.cjs
  - access-control.cjs
  - offline-login.cjs
  - cloud-sync.cjs
  - auth-public-config.json
  - package.json

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Balaji Ortho Care Connect"
  artifactName: "BalajiOrthoConnect-Setup-${version}.exe"

protocols:
  - name: Balaji Clinic Family Profile
    schemes: [balajiclinic]
