name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Bump patch version
        id: bump
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Remote se latest lo
          git fetch origin main
          git reset --hard origin/main

          # Version bump
          npm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Commit
          git add package.json package-lock.json
          git commit -m "chore: bump version to v$VERSION [skip ci]"

          # Tag — agar pehle se exist kare to delete karke dobara banao
          git tag -d "v$VERSION" 2>/dev/null || true
          git push origin ":refs/tags/v$VERSION" 2>/dev/null || true
          git tag "v$VERSION"

          git push origin main
          git push origin "v$VERSION"

      - name: Build React App
        run: npm run build

      - name: Build & Publish Setup EXE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish always

      - name: Upload Setup EXE (build artifact, optional)
        uses: actions/upload-artifact@v4
        with:
          name: BalajiOrthoConnect-Setup-v${{ steps.bump.outputs.version }}
          path: release/*.exe
          retention-days: 30
